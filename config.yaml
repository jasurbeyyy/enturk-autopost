# ============================================================
#  "Jasur | Turk tili" avtomatik post tizimi — asosiy sozlamalar
#  (maxfiy kalitlar bu yerda EMAS, .env faylida saqlanadi)
# ============================================================

timezone: Asia/Tashkent

# Post chiqishidan necha daqiqa oldin tayyorlash boshlanadi
generation_minutes_before: 40
# Post chiqishidan necha daqiqa oldin adminga ko'rsatiladi
preview_minutes_before: 10
# Bot o'chiq bo'lib, vaqti o'tib ketgan post necha daqiqagacha baribir chiqariladi
late_publish_grace_minutes: 180

signature: "👉 @jasurturktili"
# Har bir post matni oxirida chiqadigan havolalar
links:
  telegram: "https://t.me/jasurturktili"
  instagram: "https://instagram.com/jasurturktili"

# ---------------- Modellar ----------------
models:
  text: gemini-3.8-flash          # 1, 2, 5-agentlar (tadqiqot, yozuvchi, sifat nazorati)
  text_fallbacks:                 # asosiy model band bo'lsa yoki limiti tugasa
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
  # 3-agent: rasm.
  #   "kreativ" — har bir postga yangi dizayn: Gemini matn modeli SVG illyustratsiya chizadi, kod sarlavha
  #               va logoni qo'yadi (rasm modeli va billing kerak emas). Ishlamasa "grafika"ga o'tadi.
  #   "grafika" — eski kod maketlari (Gemini'siz). "gemini" — Nano Banana illustratsiya (billing kerak)
  image_mode: kreativ
  image: gemini-3.1-flash-image
  image_aspect: "4:5"
  image_size: "1K"

elevenlabs:
  model_id: eleven_v3
  # ElevenLabs'dagi ovoz ID'lari (tools/list_voices.py orqali topiladi)
  voices:
    # Voice Library'dan tanlangan (elevenlabs.io'da har birini "Add to My Voices" qiling)
    tr_female: "jk1pqab9OzEmS07w0u2T"   # AURA VOX — ayol, Istanbul talaffuzi, ta'limiy
    tr_male: "qHdpkLDluFJPQyEvzZ5E"     # Mehmet Akif — erkak, standart turkcha, e-learning
  pause_ms: 650

# ---------------- Brend ----------------
brand:
  red: "#E30A17"
  white: "#FFFFFF"
  band_height: 150

# Rasm uchun Turkiya motivlari (eski "gemini" rasm rejimi uchun) (har safar biri tanlanadi)
motifs_tr:
  - Istanbul skyline with Galata Tower and mosque silhouettes at golden hour
  - Bosphorus with white ferries and seagulls
  - Turkish tea in tulip-shaped glasses on a small saucer
  - fresh simit on a street cart
  - red and white tulips
  - blue and red Iznik tile patterns as decorative border
  - Cappadocia hot-air balloons over fairy chimneys
  - Grand Bazaar mosaic lanterns
  - a nazar (evil eye) bead hanging by a window
  - a cozy Istanbul street with colorful wooden houses and a red tram
  - Turkish carpet and kilim patterns
  - Turkish coffee with lokum on a copper tray

# ---------------- Haftalik test (Telegram quiz) ----------------
# Haftada 1 marta: avval "Haftalik test" posti, ketidan 20 ta quiz (QuizBot uslubida).
# Kun va vaqtni shu yerda o'zgartirish kifoya (cron'ga tegish shart emas).
quiz:
  enabled: true
  time: "14:00"
  days: [sun]
  grammar: 10           # grammatika savollari soni
  vocab: 10             # kelime bilgisi savollari soni
  levels: [A1, A2, B1, B2]   # har hafta navbatdagi daraja
  poll_interval_seconds: 3   # quizlar orasidagi pauza
  hashtag: test

# ---------------- Post turlari (faqat turk tili) ----------------
post_types:
  yangi_sozlar:
    title: "Yangi so'zlar"
    lang: tr
    levels: [A1, A2, B1, B2]
    hashtag: yangi_sozlar
    audio_line: "🎧 Talaffuzni audioda eshiting"
    narrator: female
    requirements: >
      Exactly 10 new Turkish words around ONE everyday theme. Each word: Turkish word in bold,
      Uzbek meaning, and one short natural example sentence in Turkish (Uzbek translation of the
      sentence is optional if space is tight). Add one memory tip or mini-quiz at the end.
      Audio: each word, then its example sentence.
  kunlik_iboralar:
    title: "Kunlik iboralar"
    lang: tr
    levels: [A1, A2, B1, B2]
    hashtag: kunlik_iboralar
    audio_line: "🎧 Iboralarni audioda eshiting"
    narrator: female
    requirements: >
      4-6 everyday Turkish phrases/expressions that real people use, grouped by a real-life situation.
      Each with Uzbek meaning and when/how to use it. Include one short cultural note.
      Audio: each Turkish phrase.
  mavzuli_lugat:
    title: "Mavzuli lug'at"
    lang: tr
    levels: [A1, A2, B1, B2]
    hashtag: lugat
    audio_line: "🎧 Talaffuzni audioda eshiting"
    narrator: male
    requirements: >
      A themed mini-dictionary (6-10 items) organised in a smart way: by a grammar pattern, word family,
      opposites, collocations or categories. Uzbek meanings, 2-4 example sentences, one interactive
      prompt for comments. Audio: the Turkish items and example sentences.
  haqiqiy_diolog:
    title: "Haqiqiy diolog"
    lang: tr
    levels: [A2, B1, B2]
    hashtag: diolog
    audio_line: "🎧 Diolog audioda ikki ovozda"
    narrator: dialogue
    requirements: >
      A realistic 6-10 line Turkish dialogue from real life in Türkiye (bank, doctor, rent, market,
      work, university, phone call...). Two speakers (use 👨 and 👩 or names). Then 4-6 key words or
      phrases with Uzbek meanings. End with an interactive question. Audio: the dialogue lines only,
      speaker "male"/"female" matching the text.
  hayotiy_maslahat:
    title: "Hayotiy maslahat"
    lang: tr
    levels: [A2, B1, B2]
    hashtag: maslahat
    audio_line: "🎧 Turkcha misollar audioda"
    narrator: female
    requirements: >
      Practical advice for learning or using Turkish in daily life (common mistakes of Uzbek speakers,
      false friends, pronunciation traps, politeness, apps and habits, living/studying in Türkiye...).
      Must contain concrete Turkish examples with Uzbek explanations. Audio: the Turkish examples.
  imtihon:
    title: "Imtihon ma'lumoti"
    lang: tr
    levels: [B1, B2, C1]
    hashtag: imtihon
    audio_line: "🎧 Misollar audioda"
    narrator: male
    exams:
      - "Milliy sertifikat (turk tili) — O'zbekiston, uzbmb.uz"
      - "Türkçe Yeterlilik Sınavı (Yunus Emre Enstitüsü TYS)"
      - "TÖMER Türkçe yeterlilik sınavı (Ankara Üniversitesi TÖMER va boshqalar)"
      - "CEFR bo'yicha turk tili darajalari (A1-C1) — umumiy talablar"
    requirements: >
      Useful, ACCURATE information about the given exam: format, sections, scoring, strategies, typical
      traps, preparation tips, or verified news. Only include dates, fees, rules or numbers if they are
      confirmed by the research sources; otherwise stay general. Include a mini example task with the
      answer hidden in a spoiler when possible. Audio: the example sentences in the exam language.
  haftalik_takrorlash:
    title: "Haftalik takrorlash"
    lang: tr
    levels: [A1, A2, B1]
    hashtag: takrorlash
    audio_line: "🎧 Javoblarni audioda tekshiring"
    narrator: female
    requirements: >
      A weekly review quiz built ONLY from the items taught in this week's posts (given in the context).
      8-10 quick questions (translate, fill the gap, choose the right option), answers hidden with spoilers.
      Audio: the correct Turkish answers.

# ---------------- Haftalik jadval ----------------
# Kuniga 2 ta post. "auto" — post turi aylanib turadi (pastdagi rotation ro'yxatidan):
# oxirgi 2 ta postning turi takrorlanmaydi, qolganlaridan eng kam chiqqani olinadi.
# Biror vaqtga aniq tur kerak bo'lsa, auto o'rniga tur nomini yozing (masalan imtihon).
weekly:
  mon:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  tue:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  wed:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  thu:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  fri:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  sat:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}
  sun:
    - {time: "10:00", type: auto}
    - {time: "18:00", type: auto}

# Aylanma post turlari (faqat turk tili)
rotation:
  types: [yangi_sozlar, haqiqiy_diolog, kunlik_iboralar, hayotiy_maslahat, mavzuli_lugat, imtihon]
  no_repeat: 2
